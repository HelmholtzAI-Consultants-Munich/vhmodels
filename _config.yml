# GitHub Pages site, built by GitHub's own Jekyll (no workflow needed).
# The site mirrors the repository, so the relative links between Markdown files
# keep working: README.md is the home page, vhmodels/models/README.md the model
# catalog and docs/*.md the user guides.

title: vhmodels
description: Foundation models from the Computational Health Center at Helmholtz Munich
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

aux_links:
  GitHub: https://github.com/HelmholtzAI-Consultants-Munich/vhmodels
  Hugging Face: https://huggingface.co/virtual-human-chc

exclude:
  - output
  - skills
  - tests
  - vhmodels.egg-info

# Sidebar: only the pages below, in this order. Every other Markdown file is
# still published and searchable, but not listed.
defaults:
  - scope: { path: "" }
    values: { nav_exclude: true }
  - scope: { path: "README.md" }
    values: { title: Home, nav_order: 1, nav_exclude: false }
  - scope: { path: "vhmodels/models/README.md" }
    values: { title: Model catalog, nav_order: 2, nav_exclude: false }
  - scope: { path: "docs/model_contribution.md" }
    values: { title: Adding models, nav_order: 3, nav_exclude: false }
  - scope: { path: "docs/manifest.md" }
    values: { title: Model manifests, nav_order: 4, nav_exclude: false }
  - scope: { path: "docs/images.md" }
    values: { title: Model images, nav_order: 5, nav_exclude: false }
  - scope: { path: "docs/ray.md" }
    values: { title: Ray runtime, nav_order: 6, nav_exclude: false }
  - scope: { path: "k8s/README.md" }
    values: { title: Kubernetes, nav_order: 7, nav_exclude: false }
  - scope: { path: "slurm/README.md" }
    values: { title: HPC (Slurm), nav_order: 8, nav_exclude: false }
