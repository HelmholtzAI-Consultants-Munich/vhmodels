# Second CPU-only Ray worker, next to the H-Optimus-0 worker
# (k8s/service/models/hoptimus0/ray-worker.yaml), that hosts the ProtT5-XL-UniRef50 actor. The
# custom "prottrans" resource pins that actor here. The checkpoint is the full
# 11.3GB fp32 T5, of which only the encoder (~4.8GB in fp32) is loaded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhmodels-ray-worker-prottrans
  labels: &labels
    app.kubernetes.io/name: vhmodels-ray-worker-prottrans
    app.kubernetes.io/part-of: vhmodels-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vhmodels-ray-worker-prottrans
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ray-worker
          image: rayproject/ray:2.59.0-py311
          # 5.5Gi for the actor + 512Mi object store, ~2Gi left for the raylet.
          command:
            - ray
            - start
            - --address=vhmodels-ray-head:6379
            - --num-cpus=2
            - --num-gpus=0
            - --memory=5905580032
            - --object-store-memory=536870912
            - '--resources={"prottrans": 1}'
            - --block
          env:
            - name: HF_HOME
              value: /cache/huggingface
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 768Mi}
        # Node disk, gone with the pod: the 11.3GB checkpoint is downloaded per pod.
        - name: cache
          emptyDir: {sizeLimit: 14Gi}
