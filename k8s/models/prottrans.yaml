# Ray worker node that runs ProtTrans's image; same layout as mole.yaml, which
# explains it.
#
# Memory and volume fit the BERT, ALBERT, XLNet and ELECTRA variants (13GB of
# checkpoints together). The T5 variants do not fit: their checkpoints are
# 11GB (xl) and 45GB (xxl), which is why the test (run.sh) does not run
# examples/prottrans.py (prot_t5_xxl_bfd).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vhmodels-prottrans
  labels: &labels
    app.kubernetes.io/name: vhmodels-prottrans
    app.kubernetes.io/part-of: vhmodels-inference
spec:
  serviceName: vhmodels-prottrans
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vhmodels-prottrans
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ray-worker
          image: ghcr.io/helmholtzai-consultants-munich/vhmodels-prottrans:ray
          imagePullPolicy: Always
          command:
            - ray
            - start
            - --address=vhmodels-head:6379
            - --num-cpus=2
            - --num-gpus=0
            - --object-store-memory=536870912
            - --labels=vhmodels/project=prottrans
            - --block
          env:
            - name: VHMODELS_IMAGE_NODES
              value: "1"
            - name: HF_HOME
              value: /cache/huggingface
            # As on Slurm: transformers otherwise asks the Hub to convert the
            # .bin checkpoints to safetensors.
            - name: DISABLE_SAFETENSORS_CONVERSION
              value: "true"
            - name: OMP_NUM_THREADS
              value: "2"
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 768Mi}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          app.kubernetes.io/part-of: vhmodels-inference
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ssd
        resources: {requests: {storage: 20Gi}}
